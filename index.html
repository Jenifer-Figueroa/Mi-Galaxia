<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mi Universo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* Fondo espacio nebulosa */
      background: radial-gradient(circle at center, #1b0228 0%, #0c0114 50%, #020108 100%);
      font-family: 'Poppins', sans-serif;
      color: #fff;
    }

    /* Lienzo 3D */
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Capa de Interfaz y Fotos */
    .scene-overlay {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    /* Título Superior */
    .title-wrap {
      text-align: center;
      margin-top: 10px;
    }

    .title-wrap h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(2.5rem, 6vw, 4.2rem);
      color: #ffe3f2;
      text-shadow: 0 0 12px #ff5fa8, 0 0 30px #ff5fa8, 0 0 50px rgba(255, 95, 168, 0.6);
    }

    .title-wrap p {
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      color: #e6d4ff;
      text-shadow: 0 0 10px rgba(164, 99, 255, 0.8);
      letter-spacing: 0.05em;
      margin-top: 4px;
    }

    /* Tarjetas de Fotos Estilo Polaroid */
    .photo-card {
      position: absolute;
      width: clamp(120px, 14vw, 160px);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      padding: 8px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 95, 168, 0.25);
      pointer-events: auto;
      animation: floatAuto 5s ease-in-out infinite alternate;
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    .photo-card p {
      font-size: 0.65rem;
      text-align: center;
      margin-top: 6px;
      color: #ffd7ec;
      font-weight: 500;
      text-shadow: 0 0 6px rgba(255, 95, 168, 0.6);
    }

    /* Ubicaciones de las Fotos */
    .pos-top-left     { top: 12%; left: 4%; animation-delay: 0s; }
    .pos-bottom-left  { bottom: 12%; left: 5%; animation-delay: 1.2s; }
    .pos-top-right    { top: 12%; right: 4%; animation-delay: 2.4s; }
    .pos-bottom-right { bottom: 12%; right: 5%; animation-delay: 3.6s; }

    @keyframes floatAuto {
      0% {
        transform: translateY(0px) rotate(-3deg) scale(1);
      }
      50% {
        transform: translateY(-12px) rotate(2deg) scale(1.03);
      }
      100% {
        transform: translateY(-5px) rotate(-1deg) scale(0.98);
      }
    }

    /* Indicador inferior */
    .footer-hint {
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 5px;
    }

    /* Reproductor flotante estilo tarjeta */
    .player-card {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 340px);
      background: rgba(18, 8, 28, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 20px;
      padding: 14px 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(164, 99, 255, 0.2);
      z-index: 10;
      text-align: center;
      pointer-events: auto;
    }

    .track-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
    }

    .track-sub {
      font-size: 0.75rem;
      color: #d9b8ff;
      margin-top: 2px;
    }

    .bar-container {
      position: relative;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
      margin: 12px 0 6px;
      cursor: pointer;
    }

    .bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff5fa8, #a463ff);
      border-radius: 2px;
    }

    .player-times {
      display: flex;
      justify-content: space-between;
      font-size: 0.68rem;
      color: #c9b6de;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 8px;
    }

    .ctrl-btn, .heart-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1.1rem;
      cursor: pointer;
      opacity: 0.8;
      transition: transform 0.2s, opacity 0.2s;
    }

    .ctrl-btn:hover, .heart-btn:hover {
      opacity: 1;
      transform: scale(1.15);
    }

    .heart-btn.liked {
      color: #ff5fa8;
    }

    .play-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(255, 95, 168, 0.4);
      transition: transform 0.2s, background 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.08);
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="scene-overlay">
    <div class="title-wrap">
      <h1>Contigo,</h1>
      <p>mi universo tiene sentido.</p>
    </div>

    <!-- Fotos de muestra en los bordes -->
    <div class="photo-card pos-top-left">
      <img src="/Fotos/WhatsApp Image 2026-09-21 at 1.35.12 PM.jpeg" alt="Foto 1">
      <p>Cada momento contigo</p>
    </div>

    <div class="photo-card pos-bottom-left">
      <img src="/Fotos/WhatsApp Image 2026-09-21 at 1.35.14 PM (1).jpeg" alt="Foto 2">
      <p>Gracias por elegirme</p>
    </div>

    <div class="photo-card pos-top-right">
      <img src="/Fotos/WhatsApp Image 2026-09-21 at 1.35.14 PM.jpeg" alt="Foto 3">
      <p>Mi lugar favorito</p>
    </div>

    <div class="photo-card pos-bottom-right">
      <img src="/Fotos/WhatsApp Image 2026-09-21 at 1.35.15 PM (1).jpeg" alt="Foto 4">
      <p>Eres mi hoy y mañana</p>
    </div>

    <!-- Cajoncito de Música Reproductor -->
    <div class="player-card">
      <div class="player-info">
        <div class="track-title" id="trackTitle">Por Eso Te Amo</div>
        <div class="track-sub" id="trackSub">Río Roma</div>
      </div>

      <div class="bar-container" id="barContainer">
        <div class="bar-fill" id="barFill"></div>
      </div>

      <div class="player-times">
        <span id="curTime">0:00</span>
        <span id="durTime">3:18</span>
      </div>

      <div class="player-controls">
        <button class="ctrl-btn" id="prevBtn">⏮</button>
        <button class="play-btn" id="playBtn">▶</button>
        <button class="ctrl-btn" id="nextBtn">⏭</button>
        <button class="heart-btn" id="likeBtn">♥</button>
      </div>
    </div>

    <div class="footer-hint">Toca y arrastra para explorar la galaxia ✦</div>
  </div>

  <!-- Audio apuntando a tu archivo descargado -->
  <audio id="bg-audio" loop autoplay src="/Music/Por Eso Te Amo (Reempaque).mp3" preload="metadata"></audio>

  <!-- Librerías Three.js + Postprocesamiento Bloom -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <script>
    const LABELS = [
      { text: "TE AMO 🤍", color: "#6ec3ff" },
      { text: "MI VIDA 🤍", color: "#ff5fa8" },
      { text: "TE ADORO 🤍", color: "#8fd6ff" },
      { text: "MI CHIQUISTRIQUIS 🤍", color: "#ff8fc6" },
      { text: "AMOR INFINITO 🤍", color: "#c9a3ff" },
      { text: "MI UNIVERSO 🤍", color: "#ff5fa8" }
    ];

    let scene, camera, renderer, composer, controls;
    let galaxyGroup = new THREE.Group();
    let heartMesh;

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 10, 22);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 0, 0);

      const renderPass = new THREE.RenderPass(scene, camera);
      const bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        1.1,
        0.4,
        0.25
      );

      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
      scene.add(ambientLight);

      scene.add(galaxyGroup);

      buildHeart();
      buildGalaxy();
      buildStarfield(); // Campo de estrellas 3D de fondo
      build3DTextSprites();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    // 1. CORAZÓN CENTRAL 3D
    function buildHeart() {
      const shape = new THREE.Shape();
      const x = 0, y = 0;
      shape.moveTo(x + 25, y + 25);
      shape.bezierCurveTo(x + 25, y + 25, x, y, x, y - 25);
      shape.bezierCurveTo(x, y - 55, x - 45, y - 77, x - 70, y - 77);
      shape.bezierCurveTo(x - 110, y - 77, x - 110, y - 35, x - 110, y - 35);
      shape.bezierCurveTo(x - 110, y, x - 80, y + 35, x, y + 80);
      shape.bezierCurveTo(x + 80, y + 35, x + 110, y, x + 110, y - 35);
      shape.bezierCurveTo(x + 110, y - 35, x + 110, y - 77, x + 70, y - 77);
      shape.bezierCurveTo(x + 45, y - 77, x + 25, y - 55, x + 25, y - 25);

      const extrudeSettings = {
        depth: 12,
        bevelEnabled: true,
        bevelSegments: 6,
        steps: 2,
        bevelSize: 6,
        bevelThickness: 6
      };

      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geometry.center();

      const material = new THREE.MeshStandardMaterial({
        color: 0xff0077,
        emissive: 0xff0055,
        emissiveIntensity: 0.8,
        roughness: 0.2,
        metalness: 0.3
      });

      heartMesh = new THREE.Mesh(geometry, material);
      heartMesh.scale.set(0.02, 0.02, 0.02);
      heartMesh.rotation.x = Math.PI;
      heartMesh.position.y = 3.8;

      scene.add(heartMesh);
    }

    // 2. ÓRBITA DE PARTÍCULAS
    function buildGalaxy() {
      const particleCount = 28000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const colorCenter = new THREE.Color('#ff00aa');
      const colorMiddle = new THREE.Color('#8a00ff');
      const colorEdge = new THREE.Color('#00ccff');

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const radius = Math.pow(Math.random(), 1.6) * 14 + 0.4;
        const spinAngle = radius * 1.2;
        const branchAngle = ((i % 2) * Math.PI);

        const rx = (Math.random() - 0.5) * (radius * 0.12);
        const ry = (Math.random() - 0.5) * 0.3;
        const rz = (Math.random() - 0.5) * (radius * 0.12);

        positions[i3] = Math.cos(branchAngle + spinAngle) * radius + rx;
        positions[i3 + 1] = ry;
        positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + rz;

        let mixedColor = colorCenter.clone();
        if (radius < 6) {
          mixedColor.lerp(colorMiddle, radius / 6);
        } else {
          mixedColor.lerp(colorEdge, (radius - 6) / 8);
        }

        colors[i3] = mixedColor.r;
        colors[i3 + 1] = mixedColor.g;
        colors[i3 + 2] = mixedColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.075,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const points = new THREE.Points(geometry, material);
      galaxyGroup.add(points);
    }

    // 3. FONDO DE ESTRELLAS CÓSMICAS 3D
    function buildStarfield() {
      const starsCount = 4000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(starsCount * 3);
      const colors = new Float32Array(starsCount * 3);

      const palette = [
        new THREE.Color('#ffffff'),
        new THREE.Color('#ff8fc6'),
        new THREE.Color('#8fd6ff'),
        new THREE.Color('#d9b8ff')
      ];

      for (let i = 0; i < starsCount; i++) {
        const i3 = i * 3;
        const r = 30 + Math.random() * 50;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);

        positions[i3]     = r * Math.sin(phi) * Math.cos(theta);
        positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i3 + 2] = r * Math.cos(phi);

        const col = palette[Math.floor(Math.random() * palette.length)];
        colors[i3]     = col.r;
        colors[i3 + 1] = col.g;
        colors[i3 + 2] = col.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.18,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const starField = new THREE.Points(geometry, material);
      scene.add(starField);
    }

    // 4. TEXTOS 3D
    function build3DTextSprites() {
      LABELS.forEach((item, i) => {
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        canvas.width = 1024;
        canvas.height = 256;

        context.clearRect(0, 0, canvas.width, canvas.height);

        context.font = '900 82px "Arial Black", "Poppins", sans-serif';
        context.textAlign = 'center';
        context.textBaseline = 'middle';

        context.strokeStyle = 'rgba(0, 0, 0, 0.9)';
        context.lineWidth = 14;
        context.strokeText(item.text, canvas.width / 2, canvas.height / 2);

        context.fillStyle = item.color;
        context.shadowColor = item.color;
        context.shadowBlur = 20;
        context.fillText(item.text, canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthTest: false,
          depthWrite: false
        });

        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(6.0, 1.5, 1);

        const angle = (i / LABELS.length) * Math.PI * 2;
        const radius = 9.5;

        sprite.position.set(
          Math.cos(angle) * radius,
          0.6,
          Math.sin(angle) * radius
        );

        galaxyGroup.add(sprite);
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      if (galaxyGroup) {
        galaxyGroup.rotation.y += 0.0025;
      }

      if (heartMesh) {
        const time = Date.now() * 0.003;
        const scale = 0.02 + Math.sin(time * 2.5) * 0.0018;
        heartMesh.scale.set(scale, scale, scale);
        heartMesh.rotation.y += 0.004;
      }

      controls.update();
      composer.render();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- Lógica del Reproductor de Audio ---
    window.onload = () => {
      init();

      const audio = document.getElementById("bg-audio");
      const playBtn = document.getElementById("playBtn");
      const barFill = document.getElementById("barFill");
      const barContainer = document.getElementById("barContainer");
      const curTime = document.getElementById("curTime");
      const durTime = document.getElementById("durTime");
      const likeBtn = document.getElementById("likeBtn");

      function fmtTime(s) {
        if (isNaN(s)) return "0:00";
        const m = Math.floor(s / 60);
        const ss = Math.floor(s % 60).toString().padStart(2, '0');
        return `${m}:${ss}`;
      }

      // Configurar volumen suave al 30%
      if (audio) {
        audio.volume = 0.3;
      }

      // Reproducción automática al abrir la página
      function startAutoplay() {
        if (audio && audio.paused) {
          audio.play().then(() => {
            playBtn.textContent = '❚❚';
          }).catch(() => {
            // Si el navegador requiere interacción previa, activa en el primer toque
            const enableAudioOnClick = () => {
              audio.play().then(() => {
                playBtn.textContent = '❚❚';
              });
              document.removeEventListener('click', enableAudioOnClick);
              document.removeEventListener('touchstart', enableAudioOnClick);
            };
            document.addEventListener('click', enableAudioOnClick);
            document.addEventListener('touchstart', enableAudioOnClick);
          });
        }
      }

      startAutoplay();

      audio.addEventListener('loadedmetadata', () => {
        durTime.textContent = fmtTime(audio.duration);
      });

      playBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (audio.paused) {
          audio.play().then(() => {
            playBtn.textContent = '❚❚';
          });
        } else {
          audio.pause();
          playBtn.textContent = '▶';
        }
      });

      audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
          const pct = (audio.currentTime / audio.duration) * 100;
          barFill.style.width = `${pct}%`;
          curTime.textContent = fmtTime(audio.currentTime);
        }
      });

      barContainer.addEventListener('click', (e) => {
        const rect = barContainer.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const pct = clickX / rect.width;
        if (audio.duration) {
          audio.currentTime = pct * audio.duration;
        }
      });

      likeBtn.addEventListener('click', () => {
        likeBtn.classList.toggle('liked');
      });
    };
  </script>
</body>
</html>
