<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Mi Universo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b0228 0%, #0c0114 50%, #020108 100%);
      font-family: 'Poppins', sans-serif;
      color: #fff;
    }

    /* Lienzo 3D */
    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Título Superior */
    .title-wrap {
      position: absolute;
      top: 2vh;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .title-wrap h1 {
      font-family: 'Dancing Script', cursive;
      font-size: clamp(1.8rem, 6vw, 3.8rem);
      color: #ffe3f2;
      text-shadow: 0 0 12px #ff5fa8, 0 0 30px #ff5fa8, 0 0 50px rgba(255, 95, 168, 0.6);
    }

    .title-wrap p {
      font-size: clamp(0.7rem, 2.5vw, 1rem);
      color: #e6d4ff;
      text-shadow: 0 0 10px rgba(164, 99, 255, 0.8);
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    /* Tarjetas de Fotos Estilo Polaroid */
    .photo-card {
      position: absolute;
      width: clamp(80px, 24vw, 130px);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(8px);
      padding: 4px;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 95, 168, 0.25);
      z-index: 10;
      animation: floatAuto 5s ease-in-out infinite alternate;
    }

    .photo-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 6px;
      display: block;
    }

    .photo-card p {
      font-size: clamp(0.55rem, 1.8vw, 0.72rem);
      text-align: center;
      margin-top: 4px;
      color: #ffd7ec;
      font-weight: 500;
      text-shadow: 0 0 6px rgba(255, 95, 168, 0.6);
      white-space: normal;
      word-wrap: break-word;
      line-height: 1.2;
    }

    /* Posicionamiento adaptable */
    .pos-top-left     { top: 8vh; left: 3vw; animation-delay: 0s; }
    .pos-top-right    { top: 8vh; right: 3vw; animation-delay: 2.4s; }
    
    .pos-bottom-left  { bottom: 18vh; left: 3vw; animation-delay: 1.2s; }
    .pos-bottom-right { bottom: 18vh; right: 3vw; animation-delay: 3.6s; }

    @keyframes floatAuto {
      0% { transform: translateY(0px) rotate(-3deg); }
      50% { transform: translateY(-6px) rotate(2deg); }
      100% { transform: translateY(-3px) rotate(-1deg); }
    }

    /* Reproductor flotante */
    .player-card {
      position: fixed;
      bottom: 2vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(90vw, 340px);
      background: rgba(18, 8, 28, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 10px 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(164, 99, 255, 0.3);
      z-index: 100;
      text-align: center;
    }

    .track-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: #ffffff;
    }

    .track-sub {
      font-size: 0.68rem;
      color: #d9b8ff;
      margin-top: 1px;
    }

    .bar-container {
      position: relative;
      height: 6px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
      margin: 8px 0 4px;
      cursor: pointer;
    }

    .bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff5fa8, #a463ff);
      border-radius: 3px;
    }

    .player-times {
      display: flex;
      justify-content: space-between;
      font-size: 0.62rem;
      color: #c9b6de;
    }

    .player-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 4px;
    }

    .ctrl-btn, .heart-btn {
      background: none;
      border: none;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
      opacity: 0.85;
      padding: 4px;
    }

    .heart-btn.liked {
      color: #ff5fa8;
    }

    .play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      background: rgba(255, 255, 255, 0.22);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 12px rgba(255, 95, 168, 0.4);
    }

    @media (max-width: 480px) {
      .pos-bottom-left, .pos-bottom-right {
        bottom: 20vh;
      }
      .photo-card {
        width: 25vw;
        max-width: 110px;
      }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="title-wrap">
    <h1>Contigo,</h1>
    <p>mi universo tiene sentido.</p>
  </div>

  <!-- Fotos en las 4 esquinas -->
  <div class="photo-card pos-top-left">
    <img src="/Fotos/WhatsApp Image 2026-09-21 at 1.35.12 PM.jpeg" alt="Foto 1">
    <p>🤍Cada momento contigo es mi favorito🤍</p>
  </div>

  <div class="photo-card pos-bottom-left">
    <img src="/Fotos/WhatsApp Image 2026-09-21 at 1.35.14 PM (1).jpeg" alt="Foto 2">
    <p>🤍Gracias por elegirme🤍</p>
  </div>

  <div class="photo-card pos-top-right">
    <img src="/Fotos/WhatsApp Image 2026-09-21 at 1.35.14 PM.jpeg" alt="Foto 3">
    <p>🤍Eres mi lugar favorito🤍</p>
  </div>

  <div class="photo-card pos-bottom-right">
    <img src="/Fotos/WhatsApp Image 2026-09-21 at 1.35.15 PM (1).jpeg" alt="Foto 4">
    <p>🤍Eres mi hoy y todos mis mañanas🤍</p>
  </div>

  <!-- Reproductor de Música -->
  <div class="player-card">
    <div class="player-info">
      <div class="track-title" id="trackTitle">Por Eso Te Amo</div>
      <div class="track-sub" id="trackSub">Río Roma</div>
    </div>

    <div class="bar-container" id="barContainer">
      <div class="bar-fill" id="barFill"></div>
    </div>

    <div class="player-times">
      <span id="curTime">0:00</span>
      <span id="durTime">3:18</span>
    </div>

    <div class="player-controls">
      <button class="ctrl-btn" id="prevBtn">⏮</button>
      <button class="play-btn" id="playBtn">▶</button>
      <button class="ctrl-btn" id="nextBtn">⏭</button>
      <button class="heart-btn" id="likeBtn">♥</button>
    </div>
  </div>

  <!-- Etiqueta de audio -->
  <audio id="bg-audio" loop autoplay src="/Music/Por Eso Te Amo (Reempaque).mp3" preload="metadata"></audio>

  <!-- Librerías Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

  <script>
    const LABELS = [
      { text: "TE AMO 🤍", color: "#6ec3ff" },
      { text: "MI VIDA 🤍", color: "#ff5fa8" },
      { text: "TE ADORO 🤍", color: "#8fd6ff" },
      { text: "MI CHIQUISTRIQUIS 🤍", color: "#ff8fc6" },
      { text: "AMOR INFINITO 🤍", color: "#c9a3ff" },
      { text: "MI UNIVERSO 🤍", color: "#ff5fa8" }
    ];

    let scene, camera, renderer, composer, controls;
    let galaxyGroup = new THREE.Group();
    let heartMesh;

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 20, 26);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.target.set(0, 2, 0);

      const renderPass = new THREE.RenderPass(scene, camera);
      const bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        1.1,
        0.4,
        0.25
      );

      composer = new THREE.EffectComposer(renderer);
      composer.addPass(renderPass);
      composer.addPass(bloomPass);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
      scene.add(ambientLight);

      galaxyGroup.rotation.x = 0.25;
      scene.add(galaxyGroup);

      buildHeart();
      buildGalaxy();
      buildStarfield();
      build3DTextSprites();

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function buildHeart() {
      const shape = new THREE.Shape();
      const x = 0, y = 0;
      shape.moveTo(x + 25, y + 25);
      shape.bezierCurveTo(x + 25, y + 25, x, y, x, y - 25);
      shape.bezierCurveTo(x, y - 55, x - 45, y - 77, x - 70, y - 77);
      shape.bezierCurveTo(x - 110, y - 77, x - 110, y - 35, x - 110, y - 35);
      shape.bezierCurveTo(x - 110, y, x - 80, y + 35, x, y + 80);
      shape.bezierCurveTo(x + 80, y + 35, x + 110, y, x + 110, y - 35);
      shape.bezierCurveTo(x + 110, y - 35, x + 110, y - 77, x + 70, y - 77);
      shape.bezierCurveTo(x + 45, y - 77, x + 25, y - 55, x + 25, y - 25);

      const extrudeSettings = {
        depth: 12,
        bevelEnabled: true,
        bevelSegments: 6,
        steps: 2,
        bevelSize: 6,
        bevelThickness: 6
      };

      const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
      geometry.center();

      const material = new THREE.MeshStandardMaterial({
        color: 0xff0077,
        emissive: 0xff0055,
        emissiveIntensity: 0.8,
        roughness: 0.2,
        metalness: 0.3
      });

      heartMesh = new THREE.Mesh(geometry, material);
      heartMesh.scale.set(0.016, 0.016, 0.016);
      heartMesh.rotation.x = Math.PI;
      heartMesh.position.y = 2.5;

      scene.add(heartMesh);
    }

    function buildGalaxy() {
      const particleCount = 28000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      const colors = new Float32Array(particleCount * 3);

      const colorCenter = new THREE.Color('#ff00aa');
      const colorMiddle = new THREE.Color('#8a00ff');
      const colorEdge = new THREE.Color('#00ccff');

      for (let i = 0; i < particleCount; i++) {
        const i3 = i * 3;
        const radius = Math.pow(Math.random(), 1.6) * 12.5 + 0.4;
        const spinAngle = radius * 1.2;
        const branchAngle = ((i % 2) * Math.PI);

        const rx = (Math.random() - 0.5) * (radius * 0.12);
        const ry = (Math.random() - 0.5) * 0.3;
        const rz = (Math.random() - 0.5) * (radius * 0.12);

        positions[i3] = Math.cos(branchAngle + spinAngle) * radius + rx;
        positions[i3 + 1] = ry;
        positions[i3 + 2] = Math.sin(branchAngle + spinAngle) * radius + rz;

        let mixedColor = colorCenter.clone();
        if (radius < 6) {
          mixedColor.lerp(colorMiddle, radius / 6);
        } else {
          mixedColor.lerp(colorEdge, (radius - 6) / 8);
        }

        colors[i3] = mixedColor.r;
        colors[i3 + 1] = mixedColor.g;
        colors[i3 + 2] = mixedColor.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.065,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const points = new THREE.Points(geometry, material);
      galaxyGroup.add(points);
    }

    function buildStarfield() {
      const starsCount = 4000;
      const geometry = new THREE.BufferGeometry();
      const positions = new Float32Array(starsCount * 3);
      const colors = new Float32Array(starsCount * 3);

      const palette = [
        new THREE.Color('#ffffff'),
        new THREE.Color('#ff8fc6'),
        new THREE.Color('#8fd6ff'),
        new THREE.Color('#d9b8ff')
      ];

      for (let i = 0; i < starsCount; i++) {
        const i3 = i * 3;
        const r = 30 + Math.random() * 50;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);

        positions[i3]     = r * Math.sin(phi) * Math.cos(theta);
        positions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i3 + 2] = r * Math.cos(phi);

        const col = palette[Math.floor(Math.random() * palette.length)];
        colors[i3]     = col.r;
        colors[i3 + 1] = col.g;
        colors[i3 + 2] = col.b;
      }

      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const material = new THREE.PointsMaterial({
        size: 0.18,
        vertexColors: true,
        transparent: true,
        opacity: 0.85,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const starField = new THREE.Points(geometry, material);
      scene.add(starField);
    }

    function build3DTextSprites() {
      LABELS.forEach((item, i) => {
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');

        canvas.width = 1024;
        canvas.height = 256;

        context.clearRect(0, 0, canvas.width, canvas.height);

        context.font = '900 76px "Arial Black", "Poppins", sans-serif';
        context.textAlign = 'center';
        context.textBaseline = 'middle';

        context.strokeStyle = 'rgba(0, 0, 0, 0.9)';
        context.lineWidth = 14;
        context.strokeText(item.text, canvas.width / 2, canvas.height / 2);

        context.fillStyle = item.color;
        context.shadowColor = item.color;
        context.shadowBlur = 20;
        context.fillText(item.text, canvas.width / 2, canvas.height / 2);

        const texture = new THREE.CanvasTexture(canvas);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;

        const spriteMaterial = new THREE.SpriteMaterial({
          map: texture,
          transparent: true,
          depthTest: false,
          depthWrite: false
        });

        const sprite = new THREE.Sprite(spriteMaterial);
        sprite.scale.set(5.2, 1.3, 1);

        const angle = (i / LABELS.length) * Math.PI * 2;
        const radius = 8.2;

        sprite.position.set(
          Math.cos(angle) * radius,
          0.5,
          Math.sin(angle) * radius
        );

        galaxyGroup.add(sprite);
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      if (galaxyGroup) {
        galaxyGroup.rotation.y += 0.0025;
      }

      if (heartMesh) {
        const time = Date.now() * 0.003;
        const scale = 0.016 + Math.sin(time * 2.5) * 0.0015;
        heartMesh.scale.set(scale, scale, scale);
        heartMesh.rotation.y += 0.004;
      }

      controls.update();
      composer.render();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- Control del Reproductor de Audio ---
    window.addEventListener('load', () => {
      init();

      const audio = document.getElementById("bg-audio");
      const playBtn = document.getElementById("playBtn");
      const barFill = document.getElementById("barFill");
      const barContainer = document.getElementById("barContainer");
      const curTime = document.getElementById("curTime");
      const durTime = document.getElementById("durTime");
      const likeBtn = document.getElementById("likeBtn");

      function fmtTime(s) {
        if (isNaN(s) || !s) return "0:00";
        const m = Math.floor(s / 60);
        const ss = Math.floor(s % 60).toString().padStart(2, '0');
        return `${m}:${ss}`;
      }

      if (audio) {
        audio.volume = 0.5;

        audio.play().then(() => {
          playBtn.textContent = '❚❚';
        }).catch(() => {
          playBtn.textContent = '▶';
        });
      }

      function toggleAudio() {
        if (audio.paused) {
          audio.play().then(() => {
            playBtn.textContent = '❚❚';
          }).catch(e => console.log('Autoplay bloqueado:', e));
        } else {
          audio.pause();
          playBtn.textContent = '▶';
        }
      }

      playBtn.addEventListener('click', toggleAudio);

      audio.addEventListener('loadedmetadata', () => {
        durTime.textContent = fmtTime(audio.duration);
      });

      audio.addEventListener('timeupdate', () => {
        if (audio.duration) {
          const pct = (audio.currentTime / audio.duration) * 100;
          barFill.style.width = `${pct}%`;
          curTime.textContent = fmtTime(audio.currentTime);
        }
      });

      barContainer.addEventListener('click', (e) => {
        const rect = barContainer.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const pct = clickX / rect.width;
        if (audio.duration) {
          audio.currentTime = pct * audio.duration;
        }
      });

      likeBtn.addEventListener('click', () => {
        likeBtn.classList.toggle('liked');
      });
    });
  </script>
</body>
</html>
